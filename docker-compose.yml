services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: company

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  etl:
    build: ./etl

    depends_on:
      - postgres

    volumes:
      - ./data:/data

volumes:
  pgdata: